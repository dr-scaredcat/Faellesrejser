<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fællesrejser</title>
    <meta
      name="description"
      content="Planlægning af fællesrejser: medlemmer, pakkeliste, rejseplan, regnskab og Gudenåen."
    />

    <!-- Favicons. favicon.svg bruges af moderne browsere, .ico er fallback til
         gamle browsere og til Windows-genveje. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Gør siden installerbar som app. -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Startværdi svarende til river-700 i standardtemaet (NavBar's farve).
         applyThemeToDocument() i lib/color.ts overskriver den, så snart det
         aktive tema er hentet fra databasen. -->
    <meta name="theme-color" content="#1b4c48" />

    <!-- iOS/Safari har ikke fuld manifest-understøttelse og skal have
         tilsvarende oplysninger som meta-tags. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fællesrejser" />

    <script>
      // Chrome fyrer 'beforeinstallprompt' meget tidligt — typisk før React
      // overhovedet er mountet. Fanger vi den ikke her i <head>, er den væk,
      // og så kan vores egen installationsknap ikke gøre noget.
      //
      // preventDefault() skjuler Chromes egen lille installationsbjælke, så vi
      // selv bestemmer, hvornår og hvordan vi spørger.
      window.__installPromptEvent = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPromptEvent = e;
        window.dispatchEvent(new Event('faellesrejser:install-availability'));
      });
      window.addEventListener('appinstalled', function () {
        window.__installPromptEvent = null;
        window.dispatchEvent(new Event('faellesrejser:install-availability'));
      });
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-river-50 text-river-900 font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
